name: Deploy React App

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: projeto_software-react_js-main

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: pwd
      - run: ls
      - run: ls projeto_software-react_js-main
      - run: npm install
      - run: npm run build
